<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>개체 상세 | 거북이 기록장</title>
  <style>
    :root { --forest:#123f35; --green:#18755d; --mint:#eaf6ef; --cream:#fbfaf5; --ink:#18352d; --muted:#687b74; --line:#deebe4; } * { box-sizing:border-box; }
    body { margin:0; background:var(--cream); color:var(--ink); font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif; line-height:1.55; } main { width:min(920px,100%); margin:auto; padding:32px 24px 64px; } a { color:var(--green); font-weight:750; text-decoration:none; }
    .top { display:flex; justify-content:space-between; gap:16px; margin-bottom:26px; } .actions { display:flex; flex-wrap:wrap; gap:10px; align-items:start; } .button { padding:11px 14px; border:0; border-radius:10px; color:#fff; background:var(--green); font:inherit; font-weight:750; cursor:pointer; } .button:hover { background:#105d49; }
    .hero { display:grid; grid-template-columns:240px minmax(0,1fr); gap:28px; padding:26px; border:1px solid var(--line); border-radius:18px; background:#fff; } .picture { display:grid; place-items:center; min-height:220px; overflow:hidden; border-radius:14px; background:#dff1e8; font-size:5rem; } .picture img { width:100%; height:100%; object-fit:cover; } h1 { margin:8px 0 5px; font-size:clamp(2rem,5vw,3rem); letter-spacing:-.055em; } .species { margin:0; color:var(--muted); } .status { display:inline-block; margin-top:16px; padding:6px 9px; border-radius:999px; color:#17634e; background:#e2f2e9; font-size:.8rem; font-weight:750; }
    section { margin-top:22px; padding:24px; border:1px solid var(--line); border-radius:16px; background:#fff; } h2 { margin:0 0 14px; font-size:1.15rem; } .section-head { display:flex; justify-content:space-between; align-items:center; gap:16px; } dl { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0; margin:0; } .row { padding:13px 0; border-top:1px solid #edf1ee; } dt { color:var(--muted); font-size:.83rem; } dd { margin:4px 0 0; font-weight:700; } .memo { color:#49645a; white-space:pre-wrap; } .empty { color:var(--muted); }
    .breeding-form { display:none; grid-template-columns:repeat(2,minmax(0,1fr)); gap:15px; margin-top:18px; padding:20px; border-radius:13px; background:var(--mint); } .breeding-form.open { display:grid; } .field.full { grid-column:1 / -1; } label { display:block; margin-bottom:6px; font-size:.85rem; font-weight:750; } input, textarea, select { width:100%; padding:11px; border:1px solid #bcd6c9; border-radius:9px; color:var(--ink); background:#fff; font:inherit; } textarea { min-height:82px; resize:vertical; } input:focus, textarea:focus, select:focus { outline:3px solid #c9eadb; border-color:var(--green); } .save-row { display:flex; justify-content:flex-end; gap:10px; } .cancel { padding:10px 13px; border:1px solid #bcd6c9; border-radius:9px; color:#45665a; background:#fff; font:inherit; font-weight:750; cursor:pointer; }
    .records { display:grid; gap:10px; margin-top:17px; } .record { padding:15px; border-radius:12px; background:#f7faf8; } .record-title { display:flex; align-items:center; justify-content:space-between; gap:14px; } .record-title b { font-size:.95rem; } .record-date { color:var(--muted); font-size:.8rem; } .record-data { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; } .tag { padding:5px 8px; border-radius:999px; color:#25694f; background:#e2f2e9; font-size:.76rem; font-weight:700; } .record-note { margin:10px 0 0; color:#49645a; font-size:.9rem; white-space:pre-wrap; } .record-photo { display:block; width:min(230px,100%); max-height:180px; margin-top:12px; border-radius:10px; object-fit:cover; }
    .document-form, .quantity-form { display:none; gap:15px; margin-top:18px; padding:20px; border-radius:13px; background:var(--mint); } .document-form.open, .quantity-form.open { display:grid; } .helper { margin:0; color:var(--muted); font-size:.84rem; } .animal-checks { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; } .animal-check { display:flex; align-items:center; gap:8px; padding:10px; border:1px solid #c8dfd1; border-radius:9px; background:#fff; font-size:.88rem; } .animal-check input { width:auto; margin:0; } .document-file { margin-top:11px; font-size:.86rem; } .document-file input { padding:8px; } .document-link { display:inline-block; margin-top:10px; font-size:.86rem; } .quantity-button { margin-top:10px; } .unavailable { color:#8b4433; background:#fbe8e2; }
    @media (max-width:680px) { main { padding:24px 16px 48px; } .top { align-items:start; flex-direction:column; } .hero { grid-template-columns:1fr; } .picture { min-height:180px; } dl, .breeding-form { grid-template-columns:1fr; } .field.full { grid-column:auto; } .section-head { align-items:start; flex-direction:column; } .section-head .button { width:100%; min-height:46px; } .save-row { flex-direction:column-reverse; } .save-row button { width:100%; min-height:46px; } .animal-checks { grid-template-columns:1fr; } }
    .document-candidate { display:flex; align-items:start; gap:10px; padding:12px; border:1px solid var(--line); border-radius:10px; background:#fff; overflow-wrap:anywhere; } .document-candidate input { width:auto; margin-top:5px; } .document-candidate small { display:block; color:var(--muted); font-weight:400; }
  </style>
  <link rel="stylesheet" href="css/interface.css">
</head>
<body class="page-detail">
  <main id="app"></main>
  <script src="js/document-links.js"></script>
  <script src="js/record-store.js"></script>
  <script>
    const app = document.querySelector('#app');
    const id = new URLSearchParams(location.search).get('id');
    const animals = JSON.parse(localStorage.getItem('cites-animals') || '[]');
    const animal = animals.find(item => item.id === id);
    const escapeHtml = value => String(value || '미입력').replace(/[&<>'"]/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[character]);
    const displayDate = value => value ? value.replaceAll('-', '.') : '';
    const CALENDAR_CLIENT_ID = '815518831853-jm9apbu6j94cndmvqpk28i879mor0v91.apps.googleusercontent.com';
    let calendarTokenClient;
    let calendarAccessToken = '';
    const calendarStatus = message => { const target = document.querySelector('#breeding-calendar-status'); if (target) target.textContent = message; };
    const nextDay = value => { const date = new Date(`${value}T00:00:00`); date.setDate(date.getDate() + 1); return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`; };
    const saveCalendarListItem = (record, eventId) => {
      const events = JSON.parse(localStorage.getItem('cites-calendar-events') || '[]');
      if (!events.some(event => event.id === eventId)) events.push({ id:eventId, kind:record.type, title:`${animal.name} ${record.type} 기록`, date:record.laidAt || record.hatchedAt, note:record.memo || '' });
      localStorage.setItem('cites-calendar-events', JSON.stringify(events));
    };
    const addBreedingCalendarEvent = async record => {
      const eventDate = record.laidAt || record.hatchedAt;
      const create = async () => {
        try {
          calendarStatus('Google Calendar에 산란·부화 일정을 추가하는 중입니다…');
          const description = [`개체: ${animal.name}`, `종: ${animal.species}`, record.eggs ? `산란 알 수: ${record.eggs}` : '', record.hatchlings ? `부화 수: ${record.hatchlings}` : '', record.temperature ? `부화 온도: ${record.temperature}℃` : '', record.memo].filter(Boolean).join('\n');
          const response = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', { method:'POST', headers:{ Authorization:`Bearer ${calendarAccessToken}`, 'Content-Type':'application/json' }, body:JSON.stringify({ summary:`[사이테스 기록장] ${record.type}: ${animal.name}`, description, start:{ date:eventDate }, end:{ date:nextDay(eventDate) } }) });
          if (!response.ok) throw new Error((await response.json().catch(() => ({}))).error?.message || 'Google Calendar 요청에 실패했습니다.');
          const event = await response.json(); record.calendarEventId = event.id;
          const records = JSON.parse(localStorage.getItem('cites-breeding-records') || '[]');
          const saved = records.find(item => item.id === record.id); if (saved) saved.calendarEventId = event.id;
          localStorage.setItem('cites-breeding-records', JSON.stringify(records)); saveCalendarListItem(record, event.id);
          calendarStatus('산란·부화일을 Google Calendar에도 추가했습니다.');
        } catch (error) { calendarStatus(`기록은 저장됐지만 Calendar 추가는 하지 못했습니다: ${error.message}`); }
      };
      if (calendarAccessToken) { create(); return; }
      if (!calendarTokenClient) { calendarStatus('Google Calendar 연결 준비가 끝나지 않았습니다. 잠시 후 다시 시도해 주세요.'); return; }
      calendarTokenClient.callback = response => {
        if (response.error) { calendarStatus('기록은 저장됐지만 Google Calendar 권한이 허용되지 않았습니다.'); return; }
        calendarAccessToken = response.access_token; create();
      };
      calendarTokenClient.requestAccessToken({ prompt:'' });
    };
    window.breedingCalendarReady = () => { calendarTokenClient = google.accounts.oauth2.initTokenClient({ client_id:CALENDAR_CLIENT_ID, scope:'https://www.googleapis.com/auth/calendar.events', callback:'' }); };
    function recordsForAnimal() { return JSON.parse(localStorage.getItem('cites-breeding-records') || '[]').filter(record => record.animalId === id); }
    function documentsForAnimal() { return JSON.parse(localStorage.getItem('cites-documents') || '[]').filter(document => document.animalIds.includes(id)); }
    function initialQuantity(document) { return Number.isInteger(document.initialCount) ? document.initialCount : document.animalIds.length; }
    function usedQuantity(document) { return (document.quantityChanges || []).reduce((total, change) => total + Number(change.count || 0), 0); }
    function remainingQuantity(document) { return Math.max(0, initialQuantity(document) - usedQuantity(document)); }
    function speciesEntries(document) { return document.speciesEntries?.length ? document.speciesEntries : [{ species:document.species || animal.species, count:initialQuantity(document) }]; }
    function remainingSpeciesQuantity(document, species) { return Math.max(0, Number(speciesEntries(document).find(entry => entry.species === species)?.count || 0) - (document.quantityChanges || []).filter(change => change.species === species).reduce((total, change) => total + Number(change.count || 0), 0)); }
    function updateQuantitySpecies() { const documentId = document.querySelector('#quantity-document')?.value; const selectedDocument = JSON.parse(localStorage.getItem('cites-documents') || '[]').find(item => item.id === documentId); const select = document.querySelector('#quantity-species'); if (!select || !selectedDocument) return; select.innerHTML = speciesEntries(selectedDocument).map(entry => `<option value="${escapeHtml(entry.species)}">${escapeHtml(entry.species)} · 남은 ${remainingSpeciesQuantity(selectedDocument, entry.species)}마리</option>`).join(''); }
    function renderRecords() {
      const records = recordsForAnimal();
      const target = document.querySelector('#records');
      if (!records.length) { target.innerHTML = '<p class="empty">아직 등록한 증식 기록이 없습니다. 산란 또는 부화가 생기면 기록을 추가해 주세요.</p>'; return; }
      target.innerHTML = records.map(record => {
        const tags = [record.laidAt && `산란 ${displayDate(record.laidAt)}`, record.hatchedAt && `부화 ${displayDate(record.hatchedAt)}`, record.temperature && `부화 온도 ${escapeHtml(record.temperature)}℃`, record.eggs && `알 수 ${escapeHtml(record.eggs)}`, record.hatchlings && `부화 수 ${escapeHtml(record.hatchlings)}`].filter(Boolean).map(tag => `<span class="tag">${tag}</span>`).join('');
        const photo = record.photo ? `<img class="record-photo" src="${escapeHtml(record.photo)}" alt="${escapeHtml(record.type || '증식')} 기록 사진">` : (record.drivePhotoUrl ? `<a class="document-link" href="${escapeHtml(record.drivePhotoUrl)}" target="_blank" rel="noreferrer">Drive에 백업한 사진 보기</a>` : '');
        return `<article class="record"><div class="record-title"><b>${record.type === '산란' ? '🥚 산란 기록' : record.type === '부화' ? '🐢 부화 기록' : '🥚 증식 기록'}</b><span class="record-date">${displayDate((record.createdAt || '').slice(0, 10))}</span></div><div class="record-data">${tags}</div>${record.memo ? `<p class="record-note">${escapeHtml(record.memo)}</p>` : ''}${photo}</article>`;
      }).join('');
    }
    function setupRecordForm() {
      const form = document.querySelector('#breeding-form');
      const toggle = document.querySelector('#record-toggle');
      const cancel = document.querySelector('#record-cancel');
      toggle.addEventListener('click', () => form.classList.add('open'));
      cancel.addEventListener('click', () => { form.reset(); form.classList.remove('open'); });
      form.addEventListener('submit', event => {
        event.preventDefault();
        const type = form.querySelector('#record-type').value;
        const recordDate = form.querySelector('#record-date').value;
        const eggs = form.querySelector('#eggs').value.trim();
        const hatchlings = form.querySelector('#hatchlings').value.trim();
        const photo = form.querySelector('#breeding-photo').files[0];
        const addToCalendar = form.querySelector('#calendar-event').checked;
        if (!recordDate) { alert(`${type}일을 입력해 주세요.`); return; }
        if (type === '산란' && (!Number.isInteger(Number(eggs)) || Number(eggs) < 1)) { alert('산란 알 수를 1 이상 입력해 주세요.'); return; }
        if (type === '부화' && (!Number.isInteger(Number(hatchlings)) || Number(hatchlings) < 0)) { alert('부화 수를 0 이상 입력해 주세요.'); return; }
        if (photo && photo.size > 1024 * 1024) { alert('증식 사진은 1MB 이하로 선택해 주세요.'); return; }
        const save = photoData => {
          const record = { id:String(Date.now()), animalId:id, type, laidAt:type === '산란' ? recordDate : '', hatchedAt:type === '부화' ? recordDate : '', temperature:form.querySelector('#temperature').value.trim(), eggs, hatchlings, memo:form.querySelector('#breeding-memo').value.trim(), photoName:photo?.name || '', photo:photoData || '', createdAt:new Date().toISOString() };
          const records = JSON.parse(localStorage.getItem('cites-breeding-records') || '[]'); records.unshift(record);
          try { localStorage.setItem('cites-breeding-records', JSON.stringify(records)); } catch { alert('브라우저 저장 공간이 부족합니다. 더 작은 사진을 사용해 주세요.'); return; }
          form.reset(); form.classList.remove('open'); renderRecords();
          if (addToCalendar) addBreedingCalendarEvent(record);
        };
        if (!photo) { save(''); return; }
        const reader = new FileReader(); reader.addEventListener('load', () => save(reader.result)); reader.readAsDataURL(photo);
      });
    }
    function renderDocuments() {
      const documents = documentsForAnimal();
      const target = document.querySelector('#documents');
      const select = document.querySelector('#quantity-document');
      if (select) { select.innerHTML = documents.filter(document => !CitesRecords.isEvent(document)).map(document => `<option value="${escapeHtml(document.id)}">${escapeHtml(document.title)} · 남은 수량 ${remainingQuantity(document)}마리</option>`).join(''); updateQuantitySpecies(); }
      if (!documents.length) { target.innerHTML = '<p class="empty">연결된 서류가 없습니다. 서류 연결 버튼에서 등록된 서류를 선택해 주세요.</p>'; return; }
      target.innerHTML = documents.map(document => {
        const connectedAnimals = document.animalIds.map(animalId => animals.find(item => item.id === animalId)?.name).filter(Boolean).map(escapeHtml).join(', ');
        const reference = document.reference ? `<span class="tag">관리 번호 ${escapeHtml(document.reference)}</span>` : '';
        const fileLink = document.fileData ? `<a class="document-link" href="${escapeHtml(document.fileData)}" download="${escapeHtml(document.fileName || document.title)}">첨부 파일 내려받기</a>` : '';
        const remaining = remainingQuantity(document);
        const status = `<span class="tag">${document.kind === 'death' ? '폐사 서류 · ' : document.kind === 'transfer' ? '양도 서류 · ' : ''}연결된 동물 ${new Set(document.animalIds || []).size}마리</span>`;
        const changes = (document.quantityChanges || []).map(change => `${escapeHtml(change.reason)} ${change.count}마리`).join(', ');
        const changeText = changes ? `<p class="record-note">수량 감소 기록: ${changes}</p>` : '';
        const decreaseButton = !CitesRecords.isEvent(document) && remaining > 0 ? `<button class="cancel quantity-button" type="button" data-document-id="${escapeHtml(document.id)}">양도·폐사 수량 기록</button>` : '';
        return `<article class="record"><div class="record-title"><b>📄 ${escapeHtml(document.title)}</b><span class="record-date">${displayDate((document.createdAt || '').slice(0, 10))}</span></div><div class="record-data">${reference}<span class="tag">대상 종: ${escapeHtml(document.species || animal.species)}</span><span class="tag">등록 수량 ${initialQuantity(document)}마리</span>${status}<span class="tag">연결 개체: ${connectedAnimals || '미입력'}</span></div>${changeText}${fileLink}${decreaseButton}</article>`;
      }).join('');
      target.querySelectorAll('[data-document-id]').forEach(button => button.addEventListener('click', () => {
        select.value = button.dataset.documentId;
        updateQuantitySpecies();
        document.querySelector('#quantity-form').classList.add('open');
      }));
    }
    function setupQuantityForm() {
      const form = document.querySelector('#quantity-form');
      const toggle = document.querySelector('#quantity-toggle');
      const cancel = document.querySelector('#quantity-cancel');
      toggle.addEventListener('click', () => form.classList.add('open'));
      cancel.addEventListener('click', () => { form.reset(); form.classList.remove('open'); });
      form.addEventListener('submit', event => {
        event.preventDefault();
        const documentId = form.querySelector('#quantity-document').value;
        const species = form.querySelector('#quantity-species').value;
        const count = Number(form.querySelector('#quantity-count').value);
        const documents = JSON.parse(localStorage.getItem('cites-documents') || '[]');
        const selectedDocument = documents.find(document => document.id === documentId);
        if (!selectedDocument) { alert('수량을 관리할 서류를 선택해 주세요.'); return; }
        if (!Number.isInteger(count) || count < 1) { alert('감소할 마리 수를 1 이상으로 입력해 주세요.'); return; }
        if (count > remainingSpeciesQuantity(selectedDocument, species)) { alert(`${species}의 남은 수량 ${remainingSpeciesQuantity(selectedDocument, species)}마리를 넘어서 기록할 수 없어요.`); return; }
        selectedDocument.quantityChanges = selectedDocument.quantityChanges || [];
        selectedDocument.quantityChanges.push({ id:String(Date.now()), species, reason:form.querySelector('#quantity-reason').value, count, memo:form.querySelector('#quantity-memo').value.trim(), createdAt:new Date().toISOString() });
        localStorage.setItem('cites-documents', JSON.stringify(documents));
        form.reset(); form.classList.remove('open'); renderDocuments();
      });
    }
    function setupDocumentForm() {
      const form = document.querySelector('#document-form');
      const picker = document.querySelector('#existing-documents');
      const refresh = () => {
        const linked = JSON.parse(localStorage.getItem('cites-documents') || '[]').filter(item => (item.animalIds || []).includes(id)).map(item => item.id);
        CitesDocumentLinks.renderPicker(picker, animal, linked);
      };
      document.querySelector('#document-toggle').addEventListener('click', () => { refresh(); form.classList.add('open'); });
      document.querySelector('#document-cancel').addEventListener('click', () => { refresh(); form.classList.remove('open'); });
      form.addEventListener('submit', event => {
        event.preventDefault();
        try { CitesDocumentLinks.saveLinks(id, [...picker.querySelectorAll('input:checked')].map(input => input.value)); }
        catch (error) { alert(error.message); refresh(); return; }
        form.classList.remove('open'); renderDocuments();
      });
    }
    if (!animal) {
      app.innerHTML = '<a href="animals.html">← 동물 목록</a><section><h2>개체를 찾을 수 없어요.</h2><p class="empty">목록에서 다시 선택하거나 새 동물을 등록해 주세요.</p></section>';
    } else {
      const picture = animal.photo ? `<img src="${escapeHtml(animal.photo)}" alt="${escapeHtml(animal.name)} 대표 사진">` : '🐢';
      app.innerHTML = `<div class="top"><a href="animals.html">← 동물 목록</a><div class="actions"><a class="button" href="animal-register.html?edit=${encodeURIComponent(id)}">정보 수정</a><button class="cancel" type="button" id="animal-delete">동물 삭제</button><a class="button" href="animal-register.html?copy=${encodeURIComponent(id)}">이 동물 복사 등록</a><a class="button" href="animal-register.html">+ 새 동물 등록</a></div></div><article class="hero"><div class="picture">${picture}</div><div><p class="species">${escapeHtml(animal.category)}</p><h1>${escapeHtml(animal.name)}</h1><p class="species">${escapeHtml(animal.species)}</p><span class="status">${escapeHtml(animal.status)}</span></div></article><section><h2>기본 정보</h2><dl><div class="row"><dt>종명</dt><dd>${escapeHtml(animal.species)}</dd></div><div class="row"><dt>학명</dt><dd>${escapeHtml(animal.scientificName)}</dd></div><div class="row"><dt>생물 종류</dt><dd>${escapeHtml(animal.category)}</dd></div><div class="row"><dt>성별</dt><dd>${escapeHtml(animal.sex)}</dd></div><div class="row"><dt>출생일 또는 입고일</dt><dd>${escapeHtml(animal.date)}</dd></div></dl></section><section><h2>메모</h2><p class="memo">${escapeHtml(animal.memo)}</p></section><section><div class="section-head"><h2>연결 서류</h2><button class="button" type="button" id="document-toggle">+ 서류 연결</button></div><p class="helper">등록된 서류를 선택해 이 동물과 연결하세요. 체크를 해제하면 연결만 해제되며 서류는 보관됩니다.</p><form class="document-form" id="document-form"><div class="field full"><p class="helper">등록 수량을 초과하거나 종명·학명이 맞지 않는 서류는 선택할 수 없습니다.</p><div id="existing-documents" class="records"></div><p class="helper"><a href="documents.html">서류 · 사진에서 새 서류 등록하기</a></p></div><div class="field full save-row"><button class="cancel" type="button" id="document-cancel">취소</button><button class="button" type="submit">서류 연결 저장</button></div></form><div id="documents" class="records"></div></section><section><div class="section-head"><h2>증식 기록</h2><button class="button" type="button" id="record-toggle">+ 산란·부화 기록 추가</button></div><p class="helper">산란·부화일은 Google Calendar에 함께 추가하고, 사진은 증식신고 자료로 이 기록에 보관할 수 있어요.</p><form class="breeding-form" id="breeding-form"><div class="field"><label for="record-type">기록 종류</label><select id="record-type"><option>산란</option><option>부화</option></select></div><div class="field"><label for="record-date">산란일 또는 부화일</label><input id="record-date" type="date" required></div><div class="field"><label for="eggs">산란 알 수 <span class="helper">(산란 시 필수)</span></label><input id="eggs" inputmode="numeric" placeholder="예: 6"></div><div class="field"><label for="hatchlings">부화 수 <span class="helper">(부화 시 필수)</span></label><input id="hatchlings" inputmode="numeric" placeholder="예: 5"></div><div class="field"><label for="temperature">부화 온도 (℃) <span class="helper">(선택)</span></label><input id="temperature" inputmode="decimal" placeholder="예: 28.5"></div><div class="field"><label for="breeding-photo">기록 사진 <span class="helper">(선택 · 1MB 이하)</span></label><input id="breeding-photo" type="file" accept="image/*"></div><div class="field full"><label class="animal-check"><input id="calendar-event" type="checkbox" checked>이 날짜를 Google Calendar에도 추가</label><p class="helper" id="breeding-calendar-status"></p></div><div class="field full"><label for="breeding-memo">메모</label><textarea id="breeding-memo" placeholder="부화 상태나 증식신고에 참고할 내용을 적어 주세요."></textarea></div><div class="field full save-row"><button class="cancel" type="button" id="record-cancel">취소</button><button class="button" type="submit">기록 저장</button></div></form><div id="records" class="records"></div></section>`;
      document.querySelector('#documents').insertAdjacentHTML('afterend', `<div class="section-head" style="margin-top:22px"><h2>서류 수량 관리</h2><button class="button" type="button" id="quantity-toggle">+ 양도·폐사 기록</button></div><p class="helper">양도 또는 폐사한 수량만 기록합니다. 남은 수량이 0마리가 되면 해당 서류는 사용 불가로 표시됩니다.</p><form class="quantity-form" id="quantity-form"><div class="field"><label for="quantity-document">대상 서류</label><select id="quantity-document"></select></div><div class="field"><label for="quantity-reason">감소 사유</label><select id="quantity-reason"><option>양도</option><option>폐사</option><option>기타</option></select></div><div class="field"><label for="quantity-count">감소 수량</label><input id="quantity-count" type="number" min="1" step="1" inputmode="numeric" placeholder="예: 1"></div><div class="field"><label for="quantity-memo">메모 <span class="helper">(선택)</span></label><input id="quantity-memo" placeholder="예: 2026.09.16 양도"></div><div class="field full save-row"><button class="cancel" type="button" id="quantity-cancel">취소</button><button class="button" type="submit">수량 감소 저장</button></div></form>`);
      document.querySelector('#quantity-document').insertAdjacentHTML('afterend', '<div class="field"><label for="quantity-species">대상 종</label><select id="quantity-species"></select></div>');
      document.querySelector('#quantity-document').addEventListener('change', updateQuantitySpecies);
      document.querySelector('#animal-delete').addEventListener('click', () => {
        if (!confirm('이 동물과 해당 증식기록을 삭제하고 서류 연결을 해제할까요? 서류 자체와 Google Calendar·Drive의 백업은 유지됩니다. 삭제는 되돌릴 수 없습니다.')) return;
        try { CitesRecords.deleteAnimal(id); location.href = 'animals.html'; } catch (error) { alert(error.message); }
      });
      setupDocumentForm(); setupQuantityForm(); renderDocuments(); setupRecordForm(); renderRecords();
    }
  </script>
  <script async defer src="https://accounts.google.com/gsi/client" onload="breedingCalendarReady()"></script>
</body>
</html>
