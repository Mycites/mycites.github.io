<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서류 목록 | 거북이 기록장</title>
  <style>
    :root { --green:#18755d; --cream:#fbfaf5; --ink:#18352d; --muted:#687b74; --line:#deebe4; --mint:#eaf6ef; --danger:#8b4433; } * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--cream); font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif; line-height:1.55; } main { width:min(980px,100%); margin:auto; padding:32px 24px 64px; } a { color:var(--green); font-weight:750; text-decoration:none; }
    .top { display:flex; align-items:start; justify-content:space-between; gap:20px; margin-bottom:30px; } h1 { margin:8px 0 6px; font-size:clamp(2rem,5vw,3rem); letter-spacing:-.055em; } .sub { margin:0; color:var(--muted); }
    .summary { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-bottom:24px; } .stat { padding:18px; border:1px solid var(--line); border-radius:15px; background:#fff; } .stat span { display:block; color:var(--muted); font-size:.83rem; } .stat b { display:block; margin-top:6px; font-size:1.55rem; }
    .button { padding:11px 14px; border:0; border-radius:10px; color:#fff; background:var(--green); font:inherit; font-weight:750; cursor:pointer; } .list { display:grid; gap:14px; } .document { padding:20px; border:1px solid var(--line); border-radius:16px; background:#fff; } .head { display:flex; justify-content:space-between; align-items:start; gap:15px; } h2 { margin:0; font-size:1.08rem; } .date { color:var(--muted); font-size:.8rem; } .tags { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; } .tag { padding:6px 9px; border-radius:999px; color:#25694f; background:#e2f2e9; font-size:.78rem; font-weight:700; } .unavailable { color:var(--danger); background:#fbe8e2; } .animals { margin:13px 0 0; color:#49645a; font-size:.9rem; } .animals a { margin-right:8px; } .empty { padding:48px 24px; border:1px dashed #a6cdbb; border-radius:16px; color:var(--muted); background:#f4fbf7; text-align:center; } .document-form { display:none; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin:0 0 24px; padding:20px; border-radius:16px; background:var(--mint); } .document-form.open { display:grid; } .field.full { grid-column:1 / -1; } label { display:block; color:#385d50; font-size:.85rem; font-weight:750; } input { width:100%; margin-top:6px; padding:10px; border:1px solid #bcd6c9; border-radius:9px; background:#fff; font:inherit; } .helper { margin:6px 0 0; color:var(--muted); font-size:.82rem; } .animal-checks { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:8px; } .animal-check { display:flex; align-items:center; gap:8px; padding:10px; border:1px solid #c8dfd1; border-radius:9px; background:#fff; font-size:.86rem; } .animal-check input { width:auto; margin:0; } .species-entry { display:grid; grid-template-columns:1fr 120px auto; gap:8px; margin-top:8px; } .species-entry input { margin:0; } .remove-species { border:1px solid #e5c3b9; border-radius:8px; color:#8b4433; background:#fff; font:inherit; cursor:pointer; } .selection-status { color:#25694f; font-weight:750; } .form-actions { display:flex; justify-content:flex-end; gap:9px; } .cancel { padding:10px 13px; border:1px solid #bcd6c9; border-radius:9px; color:#45665a; background:#fff; font:inherit; font-weight:750; cursor:pointer; }
    .notice { margin-top:24px; padding:16px 18px; border-radius:13px; color:#5d431d; background:#fff3d9; font-size:.88rem; } @media (max-width:680px) { main { padding:24px 16px 48px; } .top { flex-direction:column; } .summary { grid-template-columns:1fr; } .head { flex-direction:column; } }
  </style>
</head>
<body>
  <main>
    <a href="index.html">← 대시보드</a>
    <header class="top"><div><h1>서류 · 사진</h1><p class="sub">서류를 먼저 등록하고, 서류 수량만큼 등록 개체를 한 번에 연결하세요.</p></div><button class="button" type="button" id="document-toggle">+ 서류 등록</button></header>
    <section class="summary" aria-label="서류 요약"><article class="stat"><span>등록한 서류</span><b id="document-count">0건</b></article><article class="stat"><span>사용 가능한 서류</span><b id="available-count">0건</b></article><article class="stat"><span>사용 불가 서류</span><b id="unavailable-count">0건</b></article></section>
    <form class="document-form" id="document-form"><div><label for="document-title">서류 이름</label><input id="document-title" placeholder="예: 수입 허가서 2026-01" required></div><div><label for="document-reference">관리 번호 (선택)</label><input id="document-reference" placeholder="예: CITES-2026-001"></div><div class="field full"><label>대상 종과 관리 수량</label><p class="helper">서류에 적힌 종과 각 종의 관리 수량을 입력하세요.</p><div id="species-entries"></div><button class="cancel" type="button" id="add-species" style="margin-top:10px">+ 대상 종 추가</button></div><div class="field full"><label for="document-file">서류 파일 (선택 · PDF 또는 이미지, 1MB 이하)</label><input id="document-file" type="file" accept="application/pdf,image/*"></div><div class="field full"><label>연결할 등록 개체</label><p class="helper">각 종별 관리 수량과 같은 수만 선택해 주세요.</p><p class="helper selection-status" id="selection-status"></p><div class="animal-checks" id="animal-checks"></div></div><div class="field full form-actions"><button class="cancel" type="button" id="document-cancel">취소</button><button class="button" type="submit">서류와 개체 연결 저장</button></div></form>
    <section id="document-list" class="list"></section>
    <p class="notice">이 화면은 개인 기록 관리용입니다. 법률·행정 판단을 대신하지 않으며, 파일은 현재 브라우저에만 저장됩니다.</p>
  </main>
  <script>
    const animals = JSON.parse(localStorage.getItem('cites-animals') || '[]');
    const documents = JSON.parse(localStorage.getItem('cites-documents') || '[]');
    const escapeHtml = value => String(value || '미입력').replace(/[&<>'"]/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[character]);
    const displayDate = value => value ? value.slice(0, 10).replaceAll('-', '.') : '';
    const initialQuantity = document => Number.isInteger(document.initialCount) ? document.initialCount : document.animalIds.length;
    const usedQuantity = document => (document.quantityChanges || []).reduce((total, change) => total + Number(change.count || 0), 0);
    const remainingQuantity = document => Math.max(0, initialQuantity(document) - usedQuantity(document));
    const available = documents.filter(document => remainingQuantity(document) > 0);
    document.querySelector('#document-count').textContent = `${documents.length}건`;
    document.querySelector('#available-count').textContent = `${available.length}건`;
    document.querySelector('#unavailable-count').textContent = `${documents.length - available.length}건`;
    const list = document.querySelector('#document-list');
    if (!documents.length) {
      list.innerHTML = '<div class="empty"><p>아직 등록한 서류가 없습니다.</p><p>위의 서류 등록에서 서류 수량만큼 개체를 한 번에 선택해 주세요.</p></div>';
    } else {
      documents.forEach(document => {
        const remaining = remainingQuantity(document);
        const linkedAnimals = document.animalIds.map(animalId => animals.find(animal => animal.id === animalId)).filter(Boolean);
        const animalLinks = linkedAnimals.length ? linkedAnimals.map(animal => `<a href="animal-detail.html?id=${encodeURIComponent(animal.id)}">${escapeHtml(animal.name)}</a>`).join('') : '연결된 개체 없음';
        const status = remaining > 0 ? `<span class="tag">사용 가능 · 남은 수량 ${remaining}마리</span>` : '<span class="tag unavailable">사용 불가 · 수량 0마리</span>';
        const speciesTags = (document.speciesEntries?.length ? document.speciesEntries : [{ species:document.species || linkedAnimals[0]?.species, count:initialQuantity(document) }]).map(entry => `<span class="tag">${escapeHtml(entry.species)} ${entry.count}마리</span>`).join('');
        list.insertAdjacentHTML('beforeend', `<article class="document"><div class="head"><div><h2>📄 ${escapeHtml(document.title)}</h2><span class="date">등록일 ${displayDate(document.createdAt)}</span></div>${status}</div><div class="tags">${speciesTags}<span class="tag">처음 수량 ${initialQuantity(document)}마리</span>${document.reference ? `<span class="tag">관리 번호 ${escapeHtml(document.reference)}</span>` : ''}</div><p class="animals">연결 개체: ${animalLinks}</p></article>`);
      });
    }
    const form = document.querySelector('#document-form');
    const checks = document.querySelector('#animal-checks');
    const entries = document.querySelector('#species-entries');
    const normalize = value => String(value || '').trim().toLowerCase().replaceAll(' ', '');
    const speciesEntries = () => [...entries.querySelectorAll('.species-entry')].map(row => ({ species:row.querySelector('.species-name').value.trim(), count:Number(row.querySelector('.species-count').value) }));
    const addSpeciesEntry = () => { const row = document.createElement('div'); row.className = 'species-entry'; row.innerHTML = '<input class="species-name" placeholder="예: 다이아몬드백테라핀"><input class="species-count" type="number" min="1" step="1" value="1"><button class="remove-species" type="button">삭제</button>'; entries.append(row); row.querySelector('.species-count').addEventListener('input', updateSelection); row.querySelector('.species-name').addEventListener('input', updateSelection); row.querySelector('.remove-species').addEventListener('click', () => { if (entries.children.length === 1) return; row.remove(); updateSelection(); }); };
    const updateSelection = () => { const required = speciesEntries().reduce((total, entry) => total + (Number.isInteger(entry.count) ? entry.count : 0), 0); const current = checks.querySelectorAll('input:checked').length; document.querySelector('#selection-status').textContent = `선택 ${current}마리 / 종별 서류 수량 합계 ${required}마리`; };
    const renderAnimalChecks = () => { checks.innerHTML = animals.length ? animals.map(animal => `<label class="animal-check"><input type="checkbox" name="document-animal" value="${escapeHtml(animal.id)}">${escapeHtml(animal.name)} · ${escapeHtml(animal.species)}</label>`).join('') : '<p class="helper">먼저 동물 관리에서 개체를 등록해 주세요.</p>'; checks.querySelectorAll('input').forEach(input => input.addEventListener('change', updateSelection)); };
    document.querySelector('#document-toggle').addEventListener('click', () => { form.classList.add('open'); renderAnimalChecks(); if (!entries.children.length) addSpeciesEntry(); updateSelection(); });
    document.querySelector('#add-species').addEventListener('click', addSpeciesEntry);
    document.querySelector('#document-cancel').addEventListener('click', () => { form.reset(); entries.innerHTML = ''; form.classList.remove('open'); });
    form.addEventListener('submit', event => { event.preventDefault(); const speciesList = speciesEntries(); const initialCount = speciesList.reduce((total, entry) => total + entry.count, 0); const animalIds = [...checks.querySelectorAll('input:checked')].map(input => input.value); const selectedAnimals = animalIds.map(id => animals.find(animal => animal.id === id)); const file = document.querySelector('#document-file').files[0]; if (!speciesList.length || speciesList.some(entry => !entry.species || !Number.isInteger(entry.count) || entry.count < 1)) { alert('대상 종과 관리 수량을 모두 정확히 입력해 주세요.'); return; } if (new Set(speciesList.map(entry => normalize(entry.species))).size !== speciesList.length) { alert('같은 대상 종은 한 줄로 합쳐 입력해 주세요.'); return; } if (animalIds.length !== initialCount) { alert(`종별 서류 수량 합계 ${initialCount}마리와 선택 개체 수 ${animalIds.length}마리를 같게 선택해 주세요.`); return; } if (speciesList.some(entry => selectedAnimals.filter(animal => normalize(animal?.species) === normalize(entry.species)).length !== entry.count)) { alert('각 대상 종의 관리 수량과 같은 종의 선택 개체 수를 맞춰 주세요.'); return; } if (file && file.size > 1024 * 1024) { alert('서류 파일은 1MB 이하로 선택해 주세요.'); return; } const save = fileData => { const item = { id:String(Date.now()), title:document.querySelector('#document-title').value.trim(), species:speciesList.map(entry => entry.species).join(', '), speciesEntries:speciesList, initialCount, quantityChanges:[], reference:document.querySelector('#document-reference').value.trim(), animalIds, fileName:file?.name || '', fileData:fileData || '', createdAt:new Date().toISOString() }; const saved = JSON.parse(localStorage.getItem('cites-documents') || '[]'); saved.unshift(item); try { localStorage.setItem('cites-documents', JSON.stringify(saved)); } catch { alert('저장 공간이 부족합니다. 더 작은 파일을 사용해 주세요.'); return; } location.reload(); }; if (!file) { save(''); return; } const reader = new FileReader(); reader.addEventListener('load', () => save(reader.result)); reader.readAsDataURL(file); });
  </script>
</body>
</html>
