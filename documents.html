<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서류 목록 | 거북이 기록장</title>
  <style>
    :root { --green:#18755d; --cream:#fbfaf5; --ink:#18352d; --muted:#687b74; --line:#deebe4; --mint:#eaf6ef; --danger:#8b4433; } * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--cream); font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif; line-height:1.55; } main { width:min(980px,100%); margin:auto; padding:32px 24px 64px; } a { color:var(--green); font-weight:750; text-decoration:none; }
    .top { display:flex; align-items:start; justify-content:space-between; gap:20px; margin-bottom:30px; } h1 { margin:8px 0 6px; font-size:clamp(2rem,5vw,3rem); letter-spacing:-.055em; } .sub { margin:0; color:var(--muted); }
    .summary { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-bottom:24px; } .stat { padding:18px; border:1px solid var(--line); border-radius:15px; background:#fff; } .stat span { display:block; color:var(--muted); font-size:.83rem; } .stat b { display:block; margin-top:6px; font-size:1.55rem; }
    .list { display:grid; gap:14px; } .document { padding:20px; border:1px solid var(--line); border-radius:16px; background:#fff; } .head { display:flex; justify-content:space-between; align-items:start; gap:15px; } h2 { margin:0; font-size:1.08rem; } .date { color:var(--muted); font-size:.8rem; } .tags { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; } .tag { padding:6px 9px; border-radius:999px; color:#25694f; background:#e2f2e9; font-size:.78rem; font-weight:700; } .unavailable { color:var(--danger); background:#fbe8e2; } .animals { margin:13px 0 0; color:#49645a; font-size:.9rem; } .animals a { margin-right:8px; } .empty { padding:48px 24px; border:1px dashed #a6cdbb; border-radius:16px; color:var(--muted); background:#f4fbf7; text-align:center; }
    .notice { margin-top:24px; padding:16px 18px; border-radius:13px; color:#5d431d; background:#fff3d9; font-size:.88rem; } @media (max-width:680px) { main { padding:24px 16px 48px; } .top { flex-direction:column; } .summary { grid-template-columns:1fr; } .head { flex-direction:column; } }
  </style>
</head>
<body>
  <main>
    <a href="index.html">← 대시보드</a>
    <header class="top"><div><h1>서류 · 사진</h1><p class="sub">서류별 남은 관리 수량과 연결된 개체를 확인하세요.</p></div><a href="animals.html">동물 관리로 이동 →</a></header>
    <section class="summary" aria-label="서류 요약"><article class="stat"><span>등록한 서류</span><b id="document-count">0건</b></article><article class="stat"><span>사용 가능한 서류</span><b id="available-count">0건</b></article><article class="stat"><span>사용 불가 서류</span><b id="unavailable-count">0건</b></article></section>
    <section id="document-list" class="list"></section>
    <p class="notice">이 화면은 개인 기록 관리용입니다. 법률·행정 판단을 대신하지 않으며, 파일은 현재 브라우저에만 저장됩니다.</p>
  </main>
  <script>
    const animals = JSON.parse(localStorage.getItem('cites-animals') || '[]');
    const documents = JSON.parse(localStorage.getItem('cites-documents') || '[]');
    const escapeHtml = value => String(value || '미입력').replace(/[&<>'"]/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[character]);
    const displayDate = value => value ? value.slice(0, 10).replaceAll('-', '.') : '';
    const initialQuantity = document => Number.isInteger(document.initialCount) ? document.initialCount : document.animalIds.length;
    const usedQuantity = document => (document.quantityChanges || []).reduce((total, change) => total + Number(change.count || 0), 0);
    const remainingQuantity = document => Math.max(0, initialQuantity(document) - usedQuantity(document));
    const available = documents.filter(document => remainingQuantity(document) > 0);
    document.querySelector('#document-count').textContent = `${documents.length}건`;
    document.querySelector('#available-count').textContent = `${available.length}건`;
    document.querySelector('#unavailable-count').textContent = `${documents.length - available.length}건`;
    const list = document.querySelector('#document-list');
    if (!documents.length) {
      list.innerHTML = '<div class="empty"><p>아직 등록한 서류가 없습니다.</p><a href="animals.html">개체 상세 화면에서 첫 서류를 연결해 보세요.</a></div>';
    } else {
      documents.forEach(document => {
        const remaining = remainingQuantity(document);
        const linkedAnimals = document.animalIds.map(animalId => animals.find(animal => animal.id === animalId)).filter(Boolean);
        const animalLinks = linkedAnimals.length ? linkedAnimals.map(animal => `<a href="animal-detail.html?id=${encodeURIComponent(animal.id)}">${escapeHtml(animal.name)}</a>`).join('') : '연결된 개체 없음';
        const status = remaining > 0 ? `<span class="tag">사용 가능 · 남은 수량 ${remaining}마리</span>` : '<span class="tag unavailable">사용 불가 · 수량 0마리</span>';
        list.insertAdjacentHTML('beforeend', `<article class="document"><div class="head"><div><h2>📄 ${escapeHtml(document.title)}</h2><span class="date">등록일 ${displayDate(document.createdAt)}</span></div>${status}</div><div class="tags"><span class="tag">대상 종: ${escapeHtml(document.species || linkedAnimals[0]?.species)}</span><span class="tag">처음 수량 ${initialQuantity(document)}마리</span>${document.reference ? `<span class="tag">관리 번호 ${escapeHtml(document.reference)}</span>` : ''}</div><p class="animals">연결 개체: ${animalLinks}</p></article>`);
      });
    }
  </script>
</body>
</html>
