<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>동물 관리 | 거북이 기록장</title>
  <style>
    :root { --forest:#123f35; --green:#18755d; --mint:#eaf6ef; --cream:#fbfaf5; --ink:#18352d; --muted:#687b74; --line:#deebe4; } * { box-sizing:border-box; }
    body { margin:0; background:var(--cream); color:var(--ink); font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif; } main { width:min(1000px,100%); margin:auto; padding:32px 24px 64px; }
    .top { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:35px; } a { color:var(--green); font-weight:750; text-decoration:none; } h1 { margin:0; font-size:clamp(2rem,5vw,3rem); letter-spacing:-.055em; } .sub { color:var(--muted); margin:9px 0 0; }
    .add { display:inline-block; padding:12px 16px; border-radius:10px; color:#fff; background:var(--green); } .add:hover { background:#105d49; } .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin-top:28px; }
    .card { display:block; overflow:hidden; border:1px solid var(--line); border-radius:16px; color:inherit; background:#fff; text-decoration:none; } .card:hover { border-color:#8fc8b1; transform:translateY(-2px); } .picture { display:grid; place-items:center; height:150px; overflow:hidden; background:#dff1e8; font-size:4rem; } .picture img { width:100%; height:100%; object-fit:cover; } .info { padding:16px; } .info h2 { margin:0; font-size:1.08rem; } .info p { margin:5px 0 12px; color:var(--muted); font-size:.9rem; } .status { display:inline-block; padding:5px 8px; border-radius:999px; color:#17634e; background:#e2f2e9; font-size:.75rem; font-weight:750; }
    .empty { margin-top:26px; padding:48px 24px; border:1px dashed #a6cdbb; border-radius:16px; background:#f4fbf7; text-align:center; } .empty p { color:var(--muted); } @media (max-width:720px) { main { padding:24px 16px 48px; } .top { align-items:start; flex-direction:column; } .grid { grid-template-columns:1fr; } }
  </style>
  <link rel="stylesheet" href="css/interface.css">
</head>
<body class="page-animals">
  <main>
    <div class="top"><div><a href="index.html">← 대시보드</a><h1>동물 관리</h1><p class="sub">등록한 동물을 사진과 이름으로 빠르게 찾아보세요.</p></div><a class="add" href="animal-register.html">+ 새 동물 등록</a></div>
    <section id="animal-list" class="grid" aria-label="등록한 동물 목록"></section>
  </main>
  <script src="js/record-store.js"></script>
  <script>
    const list = document.querySelector('#animal-list');
    const animals = JSON.parse(localStorage.getItem('cites-animals') || '[]');
    if (!animals.length) {
      list.className = 'empty';
      list.innerHTML = '<strong>아직 등록한 동물이 없어요.</strong><p>첫 번째 개체를 등록하면 이곳에서 사진과 이름으로 확인할 수 있습니다.</p><a class="add" href="animal-register.html">첫 동물 등록하기</a>';
    } else {
      animals.forEach(animal => {
        const link = document.createElement('a');
        link.className = 'card';
        link.href = `animal-detail.html?id=${encodeURIComponent(animal.id)}`;
        const picture = document.createElement('div'); picture.className = 'picture';
        if (animal.photo) { const image = document.createElement('img'); image.src = animal.photo; image.alt = `${animal.name} 대표 사진`; picture.append(image); } else { picture.textContent = '🐢'; }
        const info = document.createElement('div'); info.className = 'info';
        const title = document.createElement('h2'); title.textContent = animal.name;
        const species = document.createElement('p'); species.textContent = `${animal.species} · ${animal.category}`;
        const status = document.createElement('span'); status.className = 'status'; status.textContent = animal.status;
        info.append(title, species, status); link.append(picture, info);
        const card = document.createElement('article'); card.style.cssText='min-width:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:white';
        link.style.border='0';
        const actions=document.createElement('div'); actions.style.cssText='display:flex;justify-content:flex-end;gap:8px;padding:0 16px 14px';
        const edit=document.createElement('a');edit.href='animal-register.html?edit='+encodeURIComponent(animal.id);edit.textContent='수정';
        const remove=document.createElement('button');remove.type='button';remove.textContent='삭제';remove.style.cssText='padding:5px 10px;border:1px solid #dfb2aa;border-radius:7px;background:white;color:#a52d21;cursor:pointer';
        remove.addEventListener('click',()=>{
          if(!confirm(animal.name+' 개체와 이 개체의 증식 기록을 삭제할까요? 서류 연결은 해제되며, 서류 원본과 공유 사육환경 사진은 유지됩니다. 삭제는 되돌릴 수 없습니다.'))return;
          try{CitesRecords.deleteAnimal(animal.id);location.reload();}catch(error){alert(error.message);}
        });
        actions.append(edit,remove);card.append(link,actions);list.append(card);
      });
    }
  </script>
</body>
</html>
