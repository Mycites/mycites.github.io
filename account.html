<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>계정 로그인 | 사이테스 기록장</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fbfaf5;color:#18352d;font:15px system-ui,sans-serif}header{padding:12px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid #d8e8df;background:white}button,a{font:inherit}button{padding:9px 13px;border:1px solid #bcd6c9;border-radius:8px;background:white;color:#176b55;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.primary{background:#18755d;color:white}#welcome{max-width:720px;margin:40px auto;padding:24px}#status{flex:1 1 220px;font-size:.86rem}#status.error{color:#b42318}iframe{display:block;width:100%;height:calc(100dvh - 110px);border:0}#conflicts{padding:16px;background:#fff3d9}#conflicts button{margin:5px}[hidden]{display:none!important}.note{color:#687b74;line-height:1.7}details{padding:0 18px 10px;background:white}#account-panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 18px;background:white;border-bottom:1px solid #d8e8df}</style>
</head><body><header><strong>🐢 사이테스 기록장</strong><span id="identity"></span><span id="status" role="status">Google 연결 준비 중…</span><button id="login" class="primary" disabled>Google 계정으로 로그인</button></header>
<div id="account-panel" hidden><button id="save">지금 저장</button><button id="reload">최신 기록 불러오기</button><button id="migrate">이 기기의 기존 기록 가져오기</button><button id="export">현재 기록 파일 내려받기</button><button id="logout">로그아웃</button></div>
<main id="welcome"><h1>어디서든 같은 사육 기록</h1><p class="note">Google 계정에 연결하면 기록과 사진·PDF를 내 Google Drive에 비공개로 보관합니다. 같은 계정으로 다른 기기에서도 열 수 있습니다.</p><p class="note">로그인 연결은 일정 시간이 지나면 다시 요청될 수 있습니다. 상단의 ‘계정에 저장 완료’를 확인한 뒤 창을 닫아 주세요.</p><a href="index.html?local=1">기존 PC 기록으로 사용하기</a></main><div id="conflicts" hidden></div><iframe id="workspace" title="사육 기록 관리" hidden></iframe>
<script src="js/cloud-package.js"></script><script src="js/drive-account.js"></script><script async src="https://accounts.google.com/gsi/client" onload="citesAccountReady()" onerror="document.getElementById('status').textContent='Google 연결을 불러오지 못했습니다. 네트워크를 확인하고 새로고침해 주세요.'"></script></body></html>
