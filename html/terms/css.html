<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CSS | 개발 용어집</title><link rel="stylesheet" href="../style.css"></head><body><a class="back" href="../index.html">← 용어집으로 돌아가기</a><h1>CSS</h1><p class="lead"><strong>웹페이지의 색, 글꼴, 크기, 간격, 배치를 꾸미는 언어</strong>입니다.</p><h2>쉬운 비유</h2><div class="box">CSS는 집의 <strong>인테리어</strong>와 같습니다. 같은 방 배치라도 벽지, 가구, 조명에 따라 분위기가 달라지듯 HTML로 만든 페이지의 모습을 바꿉니다.</div><h2>수업에서 기억할 점</h2><p>CSS는 페이지의 <strong>보이는 모습</strong>을 담당합니다. HTML로 내용을 만들고 CSS로 읽기 편하고 보기 좋게 꾸민다고 기억하면 됩니다.</p></body></html>
