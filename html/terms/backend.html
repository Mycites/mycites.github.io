<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>백엔드 | 개발 용어집</title><link rel="stylesheet" href="../style.css"></head><body><a class="back" href="../index.html">← 용어집으로 돌아가기</a><h1>백엔드</h1><p class="lead"><strong>사용자에게 보이지 않는 곳에서 데이터와 중요한 기능을 처리하는 부분</strong>입니다.</p><h2>쉬운 비유</h2><div class="box">백엔드는 카페의 <strong>주방과 창고</strong>와 같습니다. 손님이 직접 보지는 않지만 주문을 받고, 메뉴를 만들고, 재료를 관리하는 핵심 일이 이곳에서 이루어집니다.</div><h2>초보자용 예시</h2><p>쇼핑몰에서 장바구니 버튼을 누른 뒤, 어떤 사용자가 어떤 상품을 담았는지 확인하고 주문 데이터에 저장하는 일은 백엔드가 처리합니다.</p><h2>수업에서 기억할 점</h2><p>프론트엔드가 화면이라면, 백엔드는 그 화면을 뒤에서 움직이는 <strong>데이터 처리 공간</strong>입니다.</p></body></html>
