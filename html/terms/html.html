<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HTML | 개발 용어집</title><link rel="stylesheet" href="../style.css"></head><body><a class="back" href="../index.html">← 용어집으로 돌아가기</a><h1>HTML</h1><p class="lead"><strong>웹페이지에 어떤 내용이 있고, 어떤 순서로 놓이는지 정하는 언어</strong>입니다.</p><h2>쉬운 비유</h2><div class="box">HTML은 집의 <strong>뼈대와 방 배치도</strong>와 같습니다. 제목, 문단, 사진, 버튼이 페이지의 어디에 있을지 정합니다.</div><h2>수업에서 기억할 점</h2><p>HTML은 웹페이지의 <strong>내용과 구조</strong>를 담당합니다. 예쁘게 꾸미는 일은 CSS, 동작을 더하는 일은 JavaScript가 맡습니다.</p></body></html>
