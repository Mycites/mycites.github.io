<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>프론트엔드 | 개발 용어집</title><link rel="stylesheet" href="../style.css"></head><body><a class="back" href="../index.html">← 용어집으로 돌아가기</a><h1>프론트엔드</h1><p class="lead"><strong>사용자가 웹사이트나 앱에서 직접 보고, 읽고, 누르는 화면 부분</strong>입니다.</p><h2>쉬운 비유</h2><div class="box">프론트엔드는 카페의 <strong>매장 앞 공간과 메뉴판</strong>과 같습니다. 손님이 보는 간판, 메뉴, 주문 버튼, 좌석처럼 서비스를 이용할 때 직접 만나는 부분입니다.</div><h2>초보자용 예시</h2><p>쇼핑몰의 상품 사진, 가격, 장바구니 버튼은 프론트엔드입니다. HTML·CSS·JavaScript를 조합해 만듭니다.</p><h2>수업에서 기억할 점</h2><p>프론트엔드는 <strong>사용자 눈앞의 화면</strong>입니다. 보이지 않는 곳에서 데이터를 처리하는 부분은 백엔드라고 합니다.</p></body></html>
