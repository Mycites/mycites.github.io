<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>증식 기록 | 사이테스 기록장</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fbfaf5;color:#18352d;font-family:system-ui,"Malgun Gothic",sans-serif;line-height:1.6}main{max-width:980px;margin:auto;padding:28px 20px}a{color:#18755d}h1{margin-bottom:6px}h2{font-size:1.05rem;margin:0}section,article{padding:18px;border:1px solid #deebe4;border-radius:14px;background:white;margin:14px 0}select,button{font:inherit;padding:10px;border:1px solid #bcd6c9;border-radius:8px;max-width:100%}button{background:#18755d;color:white;cursor:pointer}form,.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.muted{color:#687b74;font-size:.88rem}.records{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.records article{margin:0;min-width:0;overflow-wrap:anywhere}.records img{max-width:100%;height:140px;object-fit:contain}.note{white-space:pre-wrap}@media(max-width:600px){.records{grid-template-columns:1fr}}
</style></head><body><main><a href="index.html">← 대시보드</a><h1>증식 기록</h1><p class="muted">개체별 산란·부화 기록을 모아 확인하세요.</p>
<section><h2>산란·부화 기록 추가</h2><p class="muted">동물을 선택하면 해당 개체의 기록 입력 화면이 열립니다.</p><form id="new-record"><label for="animal">대상 동물</label><select id="animal" required><option value="">동물 선택</option></select><button>기록 추가</button></form><p id="no-animals" hidden>먼저 <a href="animal-register.html">동물을 등록</a>해 주세요.</p></section>
<section class="filters"><label for="kind">기록 종류</label><select id="kind"><option value="">전체</option><option>산란</option><option>부화</option></select><label for="owner">동물</label><select id="owner"><option value="">전체 동물</option></select><span id="count" class="muted" role="status"></span></section><div id="records" class="records"></div>
<script>
const animals=JSON.parse(localStorage.getItem('cites-animals')||'[]'),records=JSON.parse(localStorage.getItem('cites-breeding-records')||'[]');
const byId=id=>document.getElementById(id);const esc=value=>String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
animals.forEach(animal=>{byId('owner').add(new Option(animal.name,animal.id));if(!['양도 완료','폐사'].includes(animal.status))byId('animal').add(new Option(animal.name+' · '+animal.species,animal.id));});
byId('no-animals').hidden=byId('animal').options.length>1;
byId('new-record').addEventListener('submit',event=>{event.preventDefault();if(byId('animal').value)location.href='animal-detail.html?id='+encodeURIComponent(byId('animal').value)+'&record=new';});
function render(){const filtered=records.filter(record=>(!byId('kind').value||record.type===byId('kind').value)&&(!byId('owner').value||record.animalId===byId('owner').value)).sort((a,b)=>String(b.hatchedAt||b.laidAt||b.createdAt||'').localeCompare(String(a.hatchedAt||a.laidAt||a.createdAt||'')));byId('count').textContent=filtered.length+'건';byId('records').innerHTML=filtered.length?filtered.map(record=>{const animal=animals.find(item=>item.id===record.animalId);return '<article><h2>'+esc(animal?.name||'삭제된 개체')+' · '+esc(record.type||'증식')+'</h2><p class="muted">'+esc((record.hatchedAt||record.laidAt||record.createdAt||'').slice(0,10))+'</p><p>'+ (record.type==='산란'?'산란 '+esc(record.eggs)+'개':'부화 '+esc(record.hatchlings)+'마리')+(record.temperature?' · '+esc(record.temperature)+'℃':'')+'</p>'+(record.memo?'<p class="note">'+esc(record.memo)+'</p>':'')+(record.photo?'<img src="'+esc(record.photo)+'" alt="증식 기록 사진">':'')+(animal?'<p><a href="animal-detail.html?id='+encodeURIComponent(animal.id)+'">개체 기록 보기</a></p>':'')+'</article>';}).join(''):'<p class="muted">표시할 증식 기록이 없습니다.</p>';}
byId('kind').addEventListener('change',render);byId('owner').addEventListener('change',render);render();
</script></main></body></html>
